name: Hosted smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: API dependencies are ready
        run: |
          response="$(curl --fail --silent --show-error https://api.vinkin.org/health/ready)"
          test "$(jq -r '.status' <<<"$response")" = "ready"
          test "$(jq -r '.checks.database' <<<"$response")" = "ok"
          test "$(jq -r '.checks.redis' <<<"$response")" = "ok"
      - name: Guest Web is reachable
        run: curl --fail --silent --show-error --output /dev/null https://join.vinkin.org
      - name: Operations Console is reachable
        run: curl --fail --silent --show-error --output /dev/null https://ops.vinkin.org
      - name: Apple association file is valid
        run: |
          curl --fail --silent --show-error \
            https://join.vinkin.org/.well-known/apple-app-site-association |
            jq -e '.applinks.details[0].appIDs | contains(["APBXUQAJAU.com.vinkin.vinkinMobile"])'
