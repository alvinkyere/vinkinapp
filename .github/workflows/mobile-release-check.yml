name: Mobile release check

on:
  workflow_dispatch:

jobs:
  release-builds:
    name: Unsigned release build verification
    runs-on: macos-15
    environment: production
    env:
      SENTRY_DSN: ${{ secrets.MOBILE_SENTRY_DSN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Android release compilation
        run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/pilot.json
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
      - name: Verify iOS release compilation without signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/pilot.json
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
