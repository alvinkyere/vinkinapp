name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  provider-import-guard:
    name: Provider-import guard (PV0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: scan for prohibited provider SDK imports
        run: node tooling/scripts/check-provider-imports.mjs
      - name: scan for committed secret material
        run: node tooling/scripts/check-secrets.mjs

  packages:
    name: Package tests (zero-dependency, Node native TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: payment-provider tests
        working-directory: packages/payment-provider
        run: npm test
      - name: provider conformance suite (mock adapter)
        working-directory: packages/payment-provider-contract-tests
        run: npm test
      - name: domain tests
        working-directory: packages/domain
        run: npm test
  workspace:
    name: Workspace (pnpm) — lint, format, typecheck, API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vinkin
          POSTGRES_PASSWORD: vinkin
          POSTGRES_DB: vinkin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinkin -d vinkin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: API tests (unit + integration against services)
        working-directory: apps/api
        env:
          VINKIN_ENV: test
          VINKIN_INTEGRATION: '1'
          DATABASE_URL: postgres://vinkin:vinkin@localhost:5432/vinkin
          REDIS_URL: redis://localhost:6379
        run: |
          node src/db/migrate.ts
          npm test

  security-scans:
    name: Security scans (dependency audit + Semgrep SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ENG8 ("dependency scanning"): Dependabot (.github/dependabot.yml) covers alerting on
      # new advisories over time; this is the point-in-time gate on every PR. Fails only on
      # high/critical to avoid CI noise from low-severity transitive advisories that have no
      # realistic exploit path here — a real finding at that severity should block merge, not
      # get silently ignored in a report nobody reads.
      - name: pnpm audit (high/critical only)
        run: pnpm audit --audit-level=high
      # ENG8 ("static analysis" beyond ESLint): Semgrep's free, no-login-required public
      # rulesets. p/security-audit + p/secrets + p/typescript + p/javascript were chosen over
      # `--config auto` specifically because `auto` nudges toward a Semgrep account/login in
      # recent CLI versions — these four rulesets need neither an account nor a token.
      # `--severity ERROR` only (not the bare default, which fails on any WARNING/INFO match
      # too): this is this ruleset's first-ever run against this codebase, never dry-run
      # locally (this environment's disk was too constrained to install Semgrep's toolchain
      # to verify — disclosed in the ENG8 milestone report, not hidden), so gating on its
      # highest-confidence tier first avoids an unreviewed flood of WARNING/INFO findings
      # blocking every PR on day one. Lower-severity findings still print in the job log.
      - name: install Semgrep
        run: pip install semgrep
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/typescript \
            --config p/javascript \
            --severity ERROR \
            --error \
            --exclude 'apps/mobile/**' \
            --exclude '**/*.test.ts' \
            --exclude '**/*.integration.test.ts' \
            --exclude '**/.next/**' \
            --exclude '**/node_modules/**'

  mobile:
    name: Mobile — analyze and test hosted configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --dart-define-from-file=config/pilot.json
