packages:
  - 'apps/*'
  - 'packages/*'
# ENG8 ("dependency scanning"): forces transitive packages to their patched versions — each
# was a real `pnpm audit --audit-level=high` finding, none needed a major-version jump.
# `next>postcss` is scoped (not a bare `postcss` override) because a second postcss lineage
# exists via @tailwindcss/postcss; a bare override would have masked which one was actually
# the problem — SH1-B found that second lineage independently vulnerable to a later CVE
# (below), confirming the scoping was the right call, not just defensive caution.
#
# SH1-B (dependency drift since ENG8, found on a fresh audit — both same-major patch bumps,
# no compatibility risk):
# - `postcss` GHSA-fxqj-rqcc-2cmp (>=8.5.23 required) affected the @tailwindcss/postcss
#   lineage too, which ENG8's own `next>postcss`-scoped override never touched — added its own
#   matching scoped override rather than widening the first one, preserving ENG8's reasoning.
# - `brace-expansion` GHSA-rgw5-rvv9-x895 (a bypass of the CVE ENG8's ignored
#   GHSA-mh99-v99m-4gvg originally covered) resurfaced as two separate lineages —
#   `minimatch@3.1.5` (ESLint 9.x, guest-web/operations-console's own `eslint-config-next`
#   chain) requires `brace-expansion@^1.1.7`, and `minimatch@10.2.5` (the root's ESLint 10.x)
#   requires `^5.0.5` — both scoped overrides below stay within each parent's own declared
#   range, unlike ENG8's rejected 1.x->5.x jump: 1.1.18 and 5.0.9 are same-major patch
#   releases, so ENG8's original compatibility concern no longer applies. Still an ESLint-only
#   transitive dependency, never shipped or exposed to runtime/attacker input.
overrides:
  find-my-way: '^9.6.1'
  fast-uri: '^3.1.4'
  sharp: '^0.35.0'
  next>postcss: '^8.5.23'
  '@tailwindcss/postcss>postcss': '^8.5.23'
  minimatch@3.1.5>brace-expansion: '^1.1.18'
  minimatch@10.2.5>brace-expansion: '^5.0.9'
# Optional native/postinstall builds we deliberately skip: msgpackr-extract is a bullmq
# performance optimization with a pure-JS fallback; protobufjs' postinstall is unneeded here.
allowBuilds:
  '@sentry/cli': true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
# SH1-B: GHSA-mh99-v99m-4gvg (ENG8's ignored brace-expansion CVE) is gone, not just
# suppressed — the `brace-expansion` overrides above patch every lineage past it, confirmed by
# a clean `pnpm audit` with no ignore list at all. Removed rather than left as dead config.
